SPECIFICATION FairSpec

CONSTANTS
  MaxClock = 6
  MaxEvents = 8
  MaxQueueLen = 2
  MaxCommittedOps = 2

INVARIANTS
  TypeOK
  ReplicationQuorumBounded
  CommittedPreparesHaveQuorumAcks
  ClusterCommitDominatesReplicas
  CompletedSyncLeavesSyncingStatus
  CompletedSyncInstallsTargetCheckpoint
  ExactlyOnePrimaryReplica
  PrepareAcksBoundedByReplicaCount
  PrepareAcksEmptyWhenNoPrepare
  CommittedPreparesFormPrefix
  ViewChangeRoundConsistent
  SyncingReplicaHasActiveSyncStage

PROPERTIES
  AlwaysTypeOK
  ClockNeverDecreases
  ClusterCommitOpNeverDecreases
  ReplicaViewsNeverDecrease
  CommitNoticeAdvancesOnlyEligibleBackups
  NewPrepareAcksAreEligible
  SyncCompletionInstallsTargetCheckpoint
  CommitNoticesEventuallyApplied
  StateSyncNeedsEventuallyConsumed
  MismatchQueueEventuallyClears
  StartViewChangeSignalsEventuallyConsumed
  SVCQuorumEventuallyActivatesRound
  RepairReadyRoundEventuallyLeavesRepairing
  PreparedWithReplicationQuorumEventuallyCommitsOrViewAdvances
  ReadySyncEventuallyCompletes
  ClientRequestsEventuallyConsumedOrPrimaryStopsAccepting
